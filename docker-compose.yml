# Runs PostgreSQL locally so you don't have to install it by hand.
# Start:  docker compose up -d
# Stop:   docker compose down        (data is kept in the "pgdata" volume)
# Wipe:   docker compose down -v     (deletes all data)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: splitter
      POSTGRES_PASSWORD: splitter
      POSTGRES_DB: splitter
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
